name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Live mode must never be reachable from CI.
      LIVE_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabula
          POSTGRES_PASSWORD: tabula
          POSTGRES_DB: tabula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabula -d tabula_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, property and fuzz tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://tabula:tabula@localhost:5432/tabula_test
      - run: pnpm gen:affordances --check
      - run: pnpm gen:migrations --check
      - name: Secret scan (tracked files)
        run: pnpm scan:secrets
      - run: pnpm build
      - name: Client bundle scan (no server code or secrets sent to browsers)
        run: pnpm scan:bundle
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (desktop + phone emulation)
        run: pnpm e2e
