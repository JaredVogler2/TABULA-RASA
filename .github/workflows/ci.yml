name: CI

# One run per change: pull requests are checked as pull requests, and `main` when something lands on it.
# (Running on every branch push as well checked each commit of an open pull request twice.)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Live mode must never be reachable from CI.
      LIVE_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabula
          POSTGRES_PASSWORD: tabula
          POSTGRES_DB: tabula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabula -d tabula_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, property and fuzz tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://tabula:tabula@localhost:5432/tabula_test
      - run: pnpm gen:affordances --check
      - run: pnpm gen:migrations --check
      - run: pnpm gen:prompts --check
      - name: Secret scan (tracked files)
        run: pnpm scan:secrets
      - run: pnpm build
      - name: Client bundle scan (no server code or secrets sent to browsers)
        run: pnpm scan:bundle

  # The browser suites run against the production build with a software renderer, which is slow:
  # desktop and phone emulation are separate jobs so that neither waits for the other and each
  # has the machine to itself (a starved renderer is what makes a capture or a wait time out).
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Live mode must never be reachable from CI.
      LIVE_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabula
          POSTGRES_PASSWORD: tabula
          POSTGRES_DB: tabula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabula -d tabula_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (${{ matrix.project }})
        run: pnpm e2e --project=${{ matrix.project }}
        env:
          # the owner console's ledger lives in a schema of its own on the test database
          TEST_DATABASE_URL: postgres://tabula:tabula@localhost:5432/tabula_test
